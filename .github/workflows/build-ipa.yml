name: Build unsigned IPA

# Builds the iOS app on a macOS runner with Xcode and produces an UNSIGNED
# .ipa (AltStore re-signs it with the user's own Apple ID). No signing
# identity or certificate is used or committed.
#
# On push to main it also creates the GitHub Release for the version in
# ios-version.json (if it does not already exist) and attaches the IPA +
# app icon, so the AltStore source can point at a durable public download
# URL. The release step is idempotent: when the release already exists the
# run skips the upload entirely — the live release asset is never
# re-uploaded or overwritten.
on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/build_report_ios.md"
      - "README.md"
      - "altstore-source.json"
      - "site/docs/**"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: without this, several pushes in a row start concurrent
# runs and their AltStore sync pushes race (non-fast-forward failures).
# Queued runs wait their turn; none is cancelled.
concurrency:
  group: build-ipa-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: the AltStore sync step rebases before pushing, and
          # pull --rebase does not work reliably on a shallow clone.
          fetch-depth: 0

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # 揀最新嘅 Xcode（舊版可能缺 iOS platform，ibtool 會 'Platform Not Installed'）
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "iOS platform missing — downloading"
            sudo xcodebuild -downloadPlatform iOS || true
          fi
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Resolve version
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('ios-version.json'))['versionName'])")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "building v$V"

      - name: Prepare bundled site (binary assets + hanzi-writer-data)
        run: bash scripts/prepare-site.sh

      - name: Build (unsigned)
        run: |
          xcodebuild -project chineseword-ios.xcodeproj \
            -scheme chineseword-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify the .app
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/chineseword-ios.app"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          echo "site files bundled: $(find "$APP/site" -type f | wc -l)"
          test -f "$APP/site/index.html"
          test -f "$APP/site/glyphs/7cf4.json"
          test -f "$APP/site/hanzi-writer-data/文.json"

      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/chineseword-ios.app"
          V="${{ steps.ver.outputs.v }}"
          rm -rf Payload "chineseword-ios-v$V.ipa"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r -q "chineseword-ios-v$V.ipa" Payload
          ls -la "chineseword-ios-v$V.ipa"
          unzip -l "chineseword-ios-v$V.ipa" | head -5
          # App icon for the release / AltStore source (1024 PNG from the bundle).
          cp chineseword-ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          ls -la icon.png

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: chineseword-ios-v${{ steps.ver.outputs.v }}-unsigned
          path: chineseword-ios-v${{ steps.ver.outputs.v }}.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Create release (if missing) and attach IPA + icon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists; skipping upload."
          else
            gh release create "v$V" \
              --title "中文筆順練習簿 v$V (iOS)" \
              --notes "iOS version of 中文筆順練習簿 (v$V). Unsigned IPA for AltStore — install with AltStore using your own Apple ID. See altstore-source.json for the AltStore source." \
              "chineseword-ios-v$V.ipa" icon.png
            echo "Release v$V created."
          fi

      - name: Sync AltStore source size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          SIZE=$(stat -f%z "chineseword-ios-v$V.ipa")
          python3 -c "import json,sys;v=sys.argv[1];size=int(sys.argv[2]);p='altstore-source.json';d=json.load(open(p));c=d['apps'][0]['versions'][0];c['size']=size if c['version']==v else c['size'];open(p,'w').write(json.dumps(d,ensure_ascii=False,separators=(',',':')));print('altstore size',c['size'])" "$V" "$SIZE"
          if ! git diff --quiet altstore-source.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add altstore-source.json
            git commit -m "altstore: sync IPA size for v$V [skip ci]"
            # Rebase onto latest main before pushing: another run may have
            # moved it. Retry up to 3 times, then fail loudly so the size
            # drift is visible instead of silently skipped.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "altstore push attempt $i failed; retrying..."
              sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "failed to push altstore sync after 3 attempts"
              exit 1
            fi
          fi
